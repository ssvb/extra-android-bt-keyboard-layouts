name: Android Build

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Java (Ensure this matches your project's requirement, usually 11 or 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Make the Gradle wrapper executable (Common issue fix)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build the APK (Change to assembleRelease if you have signing config set up)
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    # 5. Upload the APK as an artifact so you can download it
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
