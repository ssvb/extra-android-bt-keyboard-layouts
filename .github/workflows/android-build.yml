name: Android Build

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate ./gradlew (pinned to version 7.6)
      run: |
        export D=`pwd`
        echo $D
        mkdir /tmp/emptydir
        pushd /tmp/emptydir
        gradle wrapper --gradle-version 7.6
        mv gradle $D
        mv gradlew $D
        popd

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
